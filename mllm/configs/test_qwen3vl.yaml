predict_with_generate: true

### method
stage: sft
finetuning_type: lora
lora_rank: 8
# lora_target: all





# video_max_pixels: 49168   # 192*256+16. default: 16384=128*128
video_max_pixels: 200720   # 448*448+16

freeze_vision_tower: false   # default: true

