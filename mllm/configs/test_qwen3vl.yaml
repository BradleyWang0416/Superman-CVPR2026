# lora_target: ['up_proj', 'k_proj', 'q_proj', 'o_proj', 'gate_proj', 'down_proj', 'v_proj']




# lora_target: ['up_proj', 'k_proj', 'q_proj', 'o_proj', 'gate_proj', 'down_proj', 'v_proj', 'visual.blocks']
lora_target: ['up_proj', 'k_proj', 'q_proj', 'o_proj', 'gate_proj', 'down_proj', 'v_proj']

# visual.blocks 结构:
# 'model.visual.blocks.0.norm1'
# 'model.visual.blocks.0.norm2'
# 'model.visual.blocks.0.attn'
# 'model.visual.blocks.0.attn.qkv'
# 'model.visual.blocks.0.attn.proj'
# 'model.visual.blocks.0.mlp'
# 'model.visual.blocks.0.mlp.gate_proj'
# 'model.visual.blocks.0.mlp.up_proj'
# 'model.visual.blocks.0.mlp.down_proj'
# 'model.visual.blocks.0.mlp.act_fn'
# up_proj, gate_proj, down_proj 已经包含在了 lora_target 中, 不需要 visual.blocks. 记得 freeze_vision_tower=False




