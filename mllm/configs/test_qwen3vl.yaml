model_name_or_path: "Qwen/Qwen3-VL-8B-Instruct"   # HF hub id, or a local path
# Point at the run's output_dir, not a checkpoint-N subdir: the final adapter is saved
# at the root, and N depends on the GPU count (3 epochs = 10,431 steps on 7 GPUs,
# 9,126 on 8). Use a checkpoint-N path only to evaluate a specific mid-training state.
adapter_name_or_path: _llamafactory_skeleton_byBrad/saves/joint_and_image/joint3d_image_affined_448x448/f8s1d8/cb8192x2048_mpjpe_Tdown1-2/hrFix_lvl0123_adaSmpl/step500000/h36m/00_SkelAttnType/01_deformable_attn_w_joint2dcpn_crsattn/00_Vid2Skel/BodypartAwareExplicit_text/10_qwen3vl/01_newVGMT/train
