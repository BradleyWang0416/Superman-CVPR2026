additional_target: ['model.deformable_sampler', 'pose_video_cross_attention', 'pose_video_ffn', 'norm_q', 'norm_kv', 'norm_ffn', 'lm_head', 'embed_tokens', 'visual.merger']
resize_vocab: true
vqvae_config: vqvae_config.py
add_special_tokens: <|skel_start|>,<|skel_end|>
